name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Build server
        run: npm run build:server

      - name: Verify package size under 1MB
        run: |
          OUTPUT=$(npm pack --dry-run 2>&1)
          PACKED=$(echo "$OUTPUT" | grep 'package size' | grep -oE '[0-9.]+ [kKmMgG]B' | head -1)
          UNPACKED=$(echo "$OUTPUT" | grep 'unpacked size' | grep -oE '[0-9.]+ [kKmMgG]B' | head -1)
          echo "Package size (tarball): $PACKED"
          echo "Unpacked size: $UNPACKED"
          # Check tarball size (not unpacked)
          VALUE=$(echo "$PACKED" | grep -oE '[0-9.]+')
          UNIT=$(echo "$PACKED" | grep -oE '[kKmMgG]B')
          if echo "$UNIT" | grep -qiE '^[mMgG]'; then
            if [ "$(echo "$VALUE >= 1" | bc)" -eq 1 ]; then
              echo "FAIL: Tarball size $PACKED exceeds 1MB limit"
              exit 1
            fi
          fi
          echo "PASS: Tarball size $PACKED is under 1MB"
